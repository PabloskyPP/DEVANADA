<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prints · Devanada</title>
  <meta name="description" content="Galería de prints de Devanada.">
  <meta name="theme-color" content="#1d4e96">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <!-- Cabecera fija: en index.html solo muestra el logo centrado -->
  <header class="site-header">
    <a href="../index.html" class="btn-back">← Volver a la página principal</a>
    <div class="header-brand">
    </div>
    <img src="DEVANADA.png" alt="Devanada" class="logo" loading="lazy">
  </header>

  <main id="contenido">
    <div class="header-container" style="display: flex; align-items: center; justify-content: center; gap: 40px;">
      <h1 class="section-title">Impresiones</h1>

      <!-- Yellow circle with price info and shadow -->
      <div class="price-circle" style="width: 180px; height: 180px; background-color: #FFD700; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); flex-shrink: 0; border: 3px solid black;">
        <p style="font-weight: bold; font-size: 16px; text-align: center; margin: 0;">
          1 print x 12 euros
        </p>
      </div>
    </div>

      <div class="print-text" style="text-align: center; margin: 20px 0;">
        <p class="hero__tagline" style="border: 2px solid black; padding: 15px 20px; display: inline-block;">
          Impresiones a tamaño A4 con papel duro de cartulina.
        </p>
      </div>


    <!--
      La cuadrícula se rellena automáticamente desde script.js
      (array PRINTS). Para añadir o quitar prints, edita
      ese array: no hace falta tocar este HTML.
    -->
    <div class="gallery-grid" id="prints-grid"></div>
  </main>

  <script src="../script.js" defer></script>
</body>
</html>
