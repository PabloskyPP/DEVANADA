<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fanzines · Devanada</title>
  <meta name="description" content="Galería de fanzines de Devanada: vídeo de presentación y todas las páginas interiores.">
  <meta name="theme-color" content="#1d4e96">
  <link rel="stylesheet" href="../styles.css">

<body>

  <!-- Cabecera fija: en index.html solo muestra el logo centrado -->
  <header class="site-header">
    <a href="../index.html" class="btn-back">← Volver a la página principal</a>
    <div class="header-brand">
    </div>
    <img src="DEVANADA.png" alt="Devanada" class="logo" loading="lazy">
  </header>

  
  <main id="contenido">
    <h1 class="section-title">Vista final de un Fanzine</h1>

    <video class="featured-video" src="sonic.mp4" controls preload="metadata">
      Tu navegador no soporta la reproducción de vídeo.
    </video>
    
    <div class="header-container" style="display: flex; align-items: center; justify-content: center; gap: 40px;">
      <h2 class="section-title">Historietas-Fanzines</h1>
        
        <!-- Yellow circle with price info and shadow -->
        <div class="price-circle" style="width: 180px; height: 180px; background-color: #FFD700; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); flex-shrink: 0; border: 3px solid black;">
          <p style="font-weight: bold; font-size: 16px; text-align: center; margin: 0;">
            1 fanzine x 5 euros<br>
            2 x 8 euros
            3 x 10 euros
          </p>
        </div>
    </div>
    
    <!--
      La cuadrícula se rellena automáticamente desde script.js
      (array FANZINE_PAGES). El distintivo "n/20" se calcula
      solo según cuántos archivos tenga el array: no hace falta
      escribirlo a mano ni tocar este HTML.
    -->
    <div class="gallery-grid gallery-grid--numbered" id="fanzine-grid"></div>
  </main>

  <script src="../script.js" defer></script>
